# LiteLLM gateway config — Phase 1 skeleton
# One model alias wired to a mock response so we can test the gateway
# end-to-end before adding Bedrock in Phase 2.

model_list:
  - model_name: gateway-test
    litellm_params:
      # MOCK ONLY: LiteLLM returns mock_response directly without calling any provider.
      # The OpenAI model name below is just a routing placeholder LiteLLM requires.
      # No OpenAI API key is used and no token leaves this host.
      model: openai/gpt-3.5-turbo
      mock_response: "Gateway is responding. This is a mock response for Phase 1 testing."

litellm_settings:
  drop_params: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  salt_key: os.environ/LITELLM_SALT_KEY
